<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Đăng Nhập 25 Tài Khoản</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: white;
    }

    .container {
      background: rgba(0, 0, 0, 0.75);
      padding: 30px;
      border-radius: 20px;
      width: 420px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
    }

    h1, h2 {
      text-align: center;
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: #00c6ff;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #0072ff;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
      min-height: 24px;
    }

    #resultArea {
      display: none;
      margin-top: 20px;
      text-align: center;
      background: rgba(255, 255, 255, 0.08);
      padding: 20px;
      border-radius: 14px;
    }

    .code {
      font-size: 42px;
      font-weight: bold;
      letter-spacing: 6px;
      color: #00ff95;
      margin: 10px 0;
    }

    .hint {
      margin-top: 20px;
      background: rgba(255,255,255,0.1);
      padding: 10px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
    }

    .small {
      font-size: 13px;
      opacity: 0.9;
    }
  </style>
</head>
<body>

    <div id="message"></div>

      const resultArea = document.getElementById("resultArea");
      const codeText = document.getElementById("codeText");
